app = "hookrelay"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/hookrelay.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[mounts]
  source = "hookrelay_data"
  destination = "/data"
